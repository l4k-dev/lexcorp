services:

  app:
    build: .
    container_name: lexcorp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www

  nginx:
    image: nginx:latest
    container_name: lexcorp_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: lexcorp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lexcorp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lexcorp
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: